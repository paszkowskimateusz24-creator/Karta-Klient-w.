<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Karty Klientów — Trasa</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5a623">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klienci">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #f5a623;
    --accent2: #e05c2a;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3498db;
    --text: #eaeaea;
    --muted: #7a7f99;
    --border: #2e3350;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--surface) 0%, #13162280 100%);
    border-bottom: 2px solid var(--accent);
    padding: 14px 16px 10px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--accent);
    line-height: 1;
  }
  .logo span { color: var(--text); }
  .header-sub {
    font-size: 10px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 1px;
    margin-top: 2px;
  }
  .btn-add-top {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
  }
  .btn-add-top:active { transform: scale(0.95); background: #d4911f; }

  /* SEARCH */
  .search-bar {
    margin: 12px 16px 0;
    position: relative;
  }
  .search-bar input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px 10px 38px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--muted); }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 16px;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    gap: 8px;
    padding: 10px 16px 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .stats-bar::-webkit-scrollbar { display: none; }
  .stat-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .stat-pill b { color: var(--text); }

  /* MAIN */
  .main { padding: 0 12px 80px; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 16px; color: var(--text); margin-bottom: 6px; }
  .empty-state p { font-size: 13px; line-height: 1.5; }

  /* CLIENT CARD */
  .client-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: transform 0.15s, border-color 0.2s;
    cursor: pointer;
  }
  .client-card:active { transform: scale(0.99); }
  .client-card.expanded { border-color: var(--accent); }

  .card-header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .card-avatar {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: #fff;
    flex-shrink: 0;
  }
  .card-title-area { flex: 1; min-width: 0; }
  .card-name {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-city {
    font-size: 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 2px;
  }
  .card-badges {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .badge {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }
  .badge.forklift { background: #1a3a2a; }
  .badge.forklift.yes { background: #1a3a2a; border: 1px solid var(--green); }
  .badge.forklift.no { background: #3a1a1a; border: 1px solid var(--red); }
  .badge.truck { background: #1a2a3a; border: 1px solid var(--blue); }
  .badge.truck.no { background: #3a1a1a; border: 1px solid var(--red); }

  .card-arrow {
    color: var(--muted);
    font-size: 12px;
    margin-left: 4px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .client-card.expanded .card-arrow { transform: rotate(180deg); color: var(--accent); }

  /* CARD DETAILS */
  .card-details {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--border);
    margin-top: 0;
    animation: slideDown 0.2s ease;
  }
  .client-card.expanded .card-details { display: block; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .detail-section {
    margin-top: 14px;
  }
  .detail-section-title {
    font-size: 10px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 1.5px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .detail-item {
    background: var(--surface2);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .detail-item.full { grid-column: 1 / -1; }
  .detail-label {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .detail-value {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
  }
  .detail-value.green { color: var(--green); }
  .detail-value.red { color: var(--red); }
  .detail-value.blue { color: var(--blue); }

  .notes-box {
    background: #1e2030;
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    font-style: italic;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .btn-action {
    flex: 1;
    padding: 9px;
    border-radius: 8px;
    border: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .btn-action:active { transform: scale(0.95); }
  .btn-edit { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-delete { background: #3a1a1a; color: var(--red); border: 1px solid #5a2a2a; }
  .btn-nav { background: #1a2a3a; color: var(--blue); border: 1px solid #2a4a6a; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding: 0 0 30px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 0;
  }
  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--accent);
    padding: 14px 20px 0;
  }

  .form-group {
    padding: 12px 20px 0;
  }
  .form-label {
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-select option { background: var(--surface2); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row .form-group { padding: 12px 0 0; }

  .form-row-wrapper { padding: 0 20px; }

  .toggle-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 6px;
  }
  .toggle-btn {
    padding: 10px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .toggle-btn.selected-yes { border-color: var(--green); color: var(--green); background: #1a3a2a; }
  .toggle-btn.selected-no { border-color: var(--red); color: var(--red); background: #3a1a1a; }

  .btn-save {
    margin: 20px 20px 0;
    width: calc(100% - 40px);
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-save:active { transform: scale(0.98); opacity: 0.9; }

  .btn-cancel {
    margin: 10px 20px 0;
    width: calc(100% - 40px);
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }

  /* PRINT */
  @media print {
    body { background: #fff; color: #000; }
    .header, .search-bar, .stats-bar, .btn-add-top, .card-actions, .modal-overlay { display: none !important; }
    .client-card { border: 1px solid #ccc; break-inside: avoid; margin-bottom: 16px; }
    .card-details { display: block !important; }
    .detail-item { background: #f5f5f5; }
    .notes-box { background: #fff8e0; border-left: 3px solid #f5a623; }
    .detail-value.green { color: #1a7a40; }
    .detail-value.red { color: #c0392b; }
    .detail-value.blue { color: #2471a3; }
    .card-arrow { display: none; }
  }

  /* CONFIRM DIALOG */
  .confirm-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .confirm-overlay.open { display: flex; }
  .confirm-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 20px;
    text-align: center;
    max-width: 300px;
    width: 100%;
  }
  .confirm-box h3 { font-size: 16px; margin-bottom: 8px; }
  .confirm-box p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .confirm-btns { display: flex; gap: 10px; }
  .confirm-btns button { flex: 1; padding: 11px; border-radius: 10px; border: none; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-confirm-del { background: var(--red); color: #fff; }
  .btn-confirm-cancel { background: var(--surface2); color: var(--text); }

  .section-divider {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--muted);
    padding: 14px 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="logo">KARTY <span>KLIENTÓW</span></div>
      <div class="header-sub">SYSTEM DOSTAW · KALISZ</div>
    </div>
    <button class="btn-add-top" onclick="openModal()">+ Dodaj</button>
  </div>
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Szukaj klienta, miasta, uwag..." oninput="renderCards()">
  </div>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="main" id="cardList"></div>

<!-- MODAL DODAJ/EDYTUJ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">NOWY KLIENT</div>

    <div class="form-group">
      <label class="form-label">Nazwa klienta *</label>
      <input class="form-input" id="f_name" placeholder="np. Meble Kowalski">
    </div>

    <div class="form-row-wrapper">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Miejscowość *</label>
          <input class="form-input" id="f_city" placeholder="np. Kalisz">
        </div>
        <div class="form-group">
          <label class="form-label">Godziny dostaw</label>
          <input class="form-input" id="f_hours" placeholder="np. 7:00–15:00">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Adres dostawy (jeśli inny niż firmowy)</label>
      <input class="form-input" id="f_address" placeholder="np. ul. Magazynowa 5, Ostrów Wlkp.">
    </div>

    <div class="form-group">
      <label class="form-label">Wózek widłowy</label>
      <div class="toggle-group">
        <button class="toggle-btn" id="t_fork_yes" onclick="setToggle('fork','yes')">✅ TAK</button>
        <button class="toggle-btn" id="t_fork_no" onclick="setToggle('fork','no')">❌ NIE</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Wjazd ciężarówką / TIR-em</label>
      <div class="toggle-group">
        <button class="toggle-btn" id="t_truck_yes" onclick="setToggle('truck','yes')">✅ TAK</button>
        <button class="toggle-btn" id="t_truck_no" onclick="setToggle('truck','no')">❌ NIE — tylko bus</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Sposób rozładunku</label>
      <select class="form-select" id="f_unload">
        <option value="">— wybierz —</option>
        <option value="Wózek widłowy">Wózek widłowy</option>
        <option value="Ręcznie">Ręcznie</option>
        <option value="Wózek lub ręcznie">Wózek lub ręcznie</option>
        <option value="Rampa / dok">Rampa / dok</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Uwagi o dojeździe</label>
      <input class="form-input" id="f_access" placeholder="np. wąska brama, niska wiata, wąska ulica">
    </div>

    <div class="form-group">
      <label class="form-label">Notatki kierowcy (tylko Ty to wiesz 💡)</label>
      <textarea class="form-textarea" id="f_notes" placeholder="np. dzwonić przed przyjazdem, wejście od tyłu, pies na łańcuchu, pan Jan zawsze czeka przy bramie..."></textarea>
    </div>

    <button class="btn-save" onclick="saveClient()">ZAPISZ KARTĘ</button>
    <button class="btn-cancel" onclick="closeModal()">Anuluj</button>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Usunąć kartę?</h3>
    <p id="confirmName">Tej operacji nie można cofnąć.</p>
    <div class="confirm-btns">
      <button class="btn-confirm-del" onclick="confirmDelete()">Usuń</button>
      <button class="btn-confirm-cancel" onclick="closeConfirm()">Anuluj</button>
    </div>
  </div>
</div>

<script>
  // ─── DATA ───────────────────────────────────────────────
  let clients = JSON.parse(localStorage.getItem('klienci') || '[]');
  let editId = null;
  let deleteId = null;
  let toggleState = { fork: null, truck: null };

  // Sample data on first run
  if (clients.length === 0) {
    clients = [
      {
        id: 1, name: 'Meble Nowak', city: 'Ostrów Wlkp.',
        address: 'ul. Magazynowa 12, Ostrów Wlkp.',
        hours: '7:00–14:00', fork: 'yes', truck: 'yes',
        unload: 'Wózek widłowy',
        access: 'Szeroka brama, łatwy wjazd',
        notes: 'Dzwonić 30 min przed przyjazdem. Pan Marek zawsze przy bramie.'
      },
      {
        id: 2, name: 'Stolarstwo Wiśniewski', city: 'Pleszew',
        address: '', hours: '8:00–16:00', fork: 'no', truck: 'no',
        unload: 'Ręcznie',
        access: 'Wąska uliczka — tylko bus! Nie wjedzie ciężarówka.',
        notes: 'Towar przenosić przez furtkę boczną. Właściciel bywa niedostępny — kontakt z żoną.'
      },
      {
        id: 3, name: 'Zakład Meblarski Kowal', city: 'Kalisz',
        address: 'ul. Przemysłowa 8, Kalisz',
        hours: '6:00–14:00', fork: 'yes', truck: 'yes',
        unload: 'Rampa / dok',
        access: 'Rampa załadunkowa od strony zachodniej',
        notes: 'Klient priorytetowy. Zawsze sprawdzić czy dok jest wolny.'
      }
    ];
    save();
  }

  function save() {
    localStorage.setItem('klienci', JSON.stringify(clients));
  }

  // ─── RENDER ─────────────────────────────────────────────
  function renderCards() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = clients.filter(c =>
      c.name.toLowerCase().includes(q) ||
      c.city.toLowerCase().includes(q) ||
      (c.notes || '').toLowerCase().includes(q) ||
      (c.access || '').toLowerCase().includes(q)
    );

    // Stats
    const sb = document.getElementById('statsBar');
    sb.innerHTML = `
      <div class="stat-pill">🚛 Klientów: <b>${clients.length}</b></div>
      <div class="stat-pill">✅ Wózek: <b>${clients.filter(c=>c.fork==='yes').length}</b></div>
      <div class="stat-pill">🚌 Tylko bus: <b>${clients.filter(c=>c.truck==='no').length}</b></div>
      <div class="stat-pill">🕐 Ograniczone godz.: <b>${clients.filter(c=>c.hours).length}</b></div>
    `;

    const list = document.getElementById('cardList');
    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">📋</div>
          <h3>${q ? 'Brak wyników' : 'Brak klientów'}</h3>
          <p>${q ? 'Spróbuj innej frazy.' : 'Dodaj pierwszą kartę klienta\nklikając + Dodaj'}</p>
        </div>`;
      return;
    }

    list.innerHTML = filtered.map(c => {
      const initials = c.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      const forkBadge = c.fork === 'yes'
        ? `<div class="badge forklift yes" title="Wózek widłowy">🏗️</div>`
        : `<div class="badge forklift no" title="Brak wózka">🙅</div>`;
      const truckBadge = c.truck === 'yes'
        ? `<div class="badge truck" title="Wjazd ciężarówką">🚛</div>`
        : `<div class="badge truck no" title="Tylko bus">🚌</div>`;

      const addrDisplay = c.address || `${c.city}`;

      return `
      <div class="client-card" id="card_${c.id}" onclick="toggleCard(${c.id})">
        <div class="card-header">
          <div class="card-avatar">${initials}</div>
          <div class="card-title-area">
            <div class="card-name">${c.name}</div>
            <div class="card-city">📍 ${c.city}${c.hours ? ' &nbsp;·&nbsp; 🕐 ' + c.hours : ''}</div>
          </div>
          <div class="card-badges">${forkBadge}${truckBadge}</div>
          <div class="card-arrow">▼</div>
        </div>
        <div class="card-details">
          <div class="detail-section">
            <div class="detail-section-title">📍 Adres i czas</div>
            <div class="detail-grid">
              <div class="detail-item full">
                <div class="detail-label">Adres dostawy</div>
                <div class="detail-value">${c.address || c.city + ' (brak szczeg.)'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Godziny dostaw</div>
                <div class="detail-value ${c.hours ? 'blue' : ''}">${c.hours || '—'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Rozładunek</div>
                <div class="detail-value">${c.unload || '—'}</div>
              </div>
            </div>
          </div>

          <div class="detail-section">
            <div class="detail-section-title">🚛 Logistyka</div>
            <div class="detail-grid">
              <div class="detail-item">
                <div class="detail-label">Wózek widłowy</div>
                <div class="detail-value ${c.fork==='yes'?'green':'red'}">${c.fork==='yes'?'✅ TAK':'❌ NIE'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Ciężarówka / TIR</div>
                <div class="detail-value ${c.truck==='yes'?'green':'red'}">${c.truck==='yes'?'✅ TAK':'🚌 Tylko bus'}</div>
              </div>
              ${c.access ? `
              <div class="detail-item full">
                <div class="detail-label">⚠️ Uwagi o dojeździe</div>
                <div class="detail-value">${c.access}</div>
              </div>` : ''}
            </div>
          </div>

          ${c.notes ? `
          <div class="detail-section">
            <div class="detail-section-title">💡 Notatki kierowcy</div>
            <div class="notes-box">${c.notes}</div>
          </div>` : ''}

          <div class="card-actions">
            <button class="btn-action btn-nav" onclick="navigate(event,'${addrDisplay}')">🗺️ Nawiguj</button>
            <button class="btn-action btn-edit" onclick="editClient(event,${c.id})">✏️ Edytuj</button>
            <button class="btn-action btn-delete" onclick="askDelete(event,${c.id},'${c.name.replace(/'/g,"\\'")}')">🗑️</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function toggleCard(id) {
    const card = document.getElementById('card_' + id);
    const wasOpen = card.classList.contains('expanded');
    document.querySelectorAll('.client-card.expanded').forEach(c => c.classList.remove('expanded'));
    if (!wasOpen) card.classList.add('expanded');
  }

  // ─── NAVIGATE ────────────────────────────────────────────
  function navigate(e, addr) {
    e.stopPropagation();
    const url = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(addr);
    window.open(url, '_blank');
  }

  // ─── MODAL ──────────────────────────────────────────────
  function openModal(id = null) {
    editId = id;
    toggleState = { fork: null, truck: null };
    document.getElementById('modalTitle').textContent = id ? 'EDYTUJ KARTĘ' : 'NOWY KLIENT';

    if (id) {
      const c = clients.find(x => x.id === id);
      document.getElementById('f_name').value = c.name;
      document.getElementById('f_city').value = c.city;
      document.getElementById('f_hours').value = c.hours || '';
      document.getElementById('f_address').value = c.address || '';
      document.getElementById('f_unload').value = c.unload || '';
      document.getElementById('f_access').value = c.access || '';
      document.getElementById('f_notes').value = c.notes || '';
      setToggle('fork', c.fork);
      setToggle('truck', c.truck);
    } else {
      ['f_name','f_city','f_hours','f_address','f_access','f_notes'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('f_unload').value = '';
      ['t_fork_yes','t_fork_no','t_truck_yes','t_truck_no'].forEach(id => {
        document.getElementById(id).className = 'toggle-btn';
      });
    }

    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('f_name').focus();
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    editId = null;
  }

  function setToggle(group, val) {
    toggleState[group] = val;
    const yes = document.getElementById(`t_${group}_yes`);
    const no = document.getElementById(`t_${group}_no`);
    yes.className = 'toggle-btn' + (val === 'yes' ? ' selected-yes' : '');
    no.className = 'toggle-btn' + (val === 'no' ? ' selected-no' : '');
  }

  function saveClient() {
    const name = document.getElementById('f_name').value.trim();
    const city = document.getElementById('f_city').value.trim();
    if (!name || !city) {
      alert('Podaj nazwę klienta i miejscowość.');
      return;
    }
    const data = {
      name,
      city,
      hours: document.getElementById('f_hours').value.trim(),
      address: document.getElementById('f_address').value.trim(),
      fork: toggleState.fork,
      truck: toggleState.truck,
      unload: document.getElementById('f_unload').value,
      access: document.getElementById('f_access').value.trim(),
      notes: document.getElementById('f_notes').value.trim(),
    };

    if (editId) {
      const i = clients.findIndex(c => c.id === editId);
      clients[i] = { ...clients[i], ...data };
    } else {
      data.id = Date.now();
      clients.unshift(data);
    }

    save();
    closeModal();
    renderCards();
  }

  function editClient(e, id) {
    e.stopPropagation();
    openModal(id);
  }

  // ─── DELETE ─────────────────────────────────────────────
  function askDelete(e, id, name) {
    e.stopPropagation();
    deleteId = id;
    document.getElementById('confirmName').textContent = `Usunąć kartę: "${name}"?`;
    document.getElementById('confirmOverlay').classList.add('open');
  }

  function confirmDelete() {
    clients = clients.filter(c => c.id !== deleteId);
    save();
    closeConfirm();
    renderCards();
  }

  function closeConfirm() {
    document.getElementById('confirmOverlay').classList.remove('open');
    deleteId = null;
  }

  // Close modal on overlay click
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.getElementById('confirmOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeConfirm();
  });

  // ─── INIT ───────────────────────────────────────────────
  renderCards();

  // ─── PWA: rejestracja service workera ─────────────────────
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
